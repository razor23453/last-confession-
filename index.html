<style>

<script>
/* a bouquet, written in code. (web port of bouqet.py)
   Customize with URL params, e.g.  index.html?to=Mom&from=Sam&message=hello&intro=0&spin=0.8
   keys: space pause | + / - speed | r reverse | n next message   (tap = pause, double-tap = next) */
const Q = new URLSearchParams(location.search);
const num = (k, d, mn) => { const v = parseFloat(Q.get(k)); const x = isFinite(v) ? v : d; return mn != null ? Math.max(mn, x) : x; };
const TO_NAME = Q.has('to') ? Q.get('to') : 'A';
const FROM_NAME = Q.get('from') || 'Red Ivan Clay';
const SIGNATURE = Q.get('signature') || '';
let MESSAGES = [
  "If I had a single flower for every time I think about you, I could walk forever in my garden.",
  "A flower cannot blossom without sunshine, and a man cannot live without love.",
  "roses are #ff005f, violets are #af87ff, i built this whole bouquet in code because i was so very bored,,, argh",
  "no water, no sunlight, just a little python",
  ""];
if (Q.get('message')) MESSAGES = [Q.get('message')];
const LETTER = Q.has('letter') ? Q.get('letter') : `Halur Yeshh happy birthday!!! Yeyyy, so um this is my way of saying happy birthday hope you like the gift :}
I've coded this ACSII flower coded this by hand for weeks 3 or 4 idk I forgot so I hope you like the giftt.

So again Happy Birthday Yeshh!! .`;
const FPS = Math.max(1, Math.floor(num('fps', 24, 1)));
const SPIN_SPEED = num('spin', 0.55), TILT = num('tilt', 0.30), CAM_DIST = num('camera', 4.0, 0.5);
const INTRO = !['0', 'false', 'no', 'off'].includes((Q.get('intro') || '1').toLowerCase());

const NUM_HEARTS = 16, NUM_PETALS = 26, TYPE_CPS = 28.0, HEART = '\u2665';
const DAISY_WHITE=[244,248,251,254,255,231], ASTER=[54,97,103,140,183,189];
const ROSE_RED=[52,88,125,161,197,204,211], ROSE_BLUSH=[95,132,175,181,217,224,231], ROSE_PEACH=[130,166,172,209,215,216,223];
const ROSE_LAV=[54,97,103,140,147,183,189], ROSE_CORAL=[88,124,160,166,203,209,216];
const SUN_PETAL=[130,172,178,214,220,227], SUN_CENTER=[52,58,94,94,130,136], GOLD_CENTER=[94,136,178,214,220];
const SAKURA_PAL=[132,168,175,211,218,224,231], SAKURA_CENTER=[89,125,162,198,223];
const LILY_PINK=[89,125,161,205,211,218,225], LILY_WHITE=[138,181,187,224,230,231], LILY_CENTER=[100,136,172,214,220];
const TULIP_RED=[52,88,124,160,196,203], TULIP_PINK=[132,168,205,211,218,225], TULIP_YELLOW=[136,178,214,220,226,229], TULIP_PURPLE=[54,91,97,134,140,183];
const BLUE=[61,68,69,75,111,117,153], LAVENDER=[54,55,97,98,134,140,183];
const GREENS=[22,28,28,34,35,71,77,114], EUCALYPTUS=[22,28,29,35,65,72,107,108,114], CORE_GREEN=[22,22,23,28,29,34];
const PAPER_PINK=[95,132,168,174,211,217,224], PAPER_LAV=[97,103,140,146,183,189,225], PAPER_CREAM=[101,137,144,180,187,223,230,231];
const TISSUE=[138,175,181,218,224,225,231], TISSUE_LAV=[97,103,140,147,183,189,225];
const RIBBON=[52,88,124,160,197,204,217,231], HEART_PRINT=[89,125,161,197], TWINE=[94,137,180,223], TAG_PAL=[137,180,187,223,230,231], CUT_END=[151,187,230];
const HEART_COLORS=[161,197,204,205,211,218], PETAL_COLORS=[175,211,217,218,224,225], MSG_COLORS=[161,168,205,211,218,225,218,211,205,168];
const SHADE='.:-=+*%@', PETAL_SHADE='.:+*#%', CORE_SHADE='.:-=+*', PETAL_CHARS=",'`.";

const PIVOT_Y=0.22, TOP_Y=1.06, INV_2PI=1/(2*Math.PI), AMBIENT=0.34, TWO_PI=2*Math.PI;
let LX=-0.45, LY=0.6, LZ=0.66; { const n=Math.hypot(LX,LY,LZ); LX/=n; LY/=n; LZ/=n; }
const CEN=[0,0.14,0], DOME=0.68, CORE_R=0.50, NECK=[0,-0.10,0], STEM_CUT=0.24;
const Y0=-0.30, Y1=0.30, R0=0.05, R1=0.44, KC=(R1-R0)/(Y1-Y0), BY=-0.06;
const [ROSE,SUN,DAISY,SAKURA,LILY,TULIP,HYDRA]=[0,1,2,3,4,5,6];
const RADIAL={[ROSE]:1.0,[SUN]:0.99,[DAISY]:0.98,[SAKURA]:1.0,[LILY]:1.04,[TULIP]:1.10,[HYDRA]:0.96};
const SPEC={[ROSE]:[0,0.50,0,0.45,0,null],[SUN]:[0.46,0.50,0.20,0.10,18,SUN_CENTER],[DAISY]:[0.30,0.62,0.15,0.10,13,GOLD_CENTER],
  [SAKURA]:[0.13,0.56,0.35,0.05,5,SAKURA_CENTER],[LILY]:[0.15,0.50,0.50,0.10,6,LILY_CENTER]};
const NTAB=96;
let ENV=null;
const mod=(a,b)=>((a%b)+b)%b;

/* seeded rng (so the bouquet is the same every load) */
function Rng(seed){let a=seed>>>0;this.random=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  this.uniform=(lo,hi)=>lo+(hi-lo)*this.random();
  this.gauss=(m,s)=>m+s*Math.sqrt(-2*Math.log(1-this.random()))*Math.cos(TWO_PI*this.random());
  this.choice=a=>a[Math.floor(this.random()*a.length)];}

const norm=v=>{const m=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/m,v[1]/m,v[2]/m];};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const basis=ax=>{const h=Math.abs(ax[1])<0.9?[0,1,0]:[1,0,0];const u=norm(cross(h,ax));return[u,cross(ax,u)];};
const add=(p,d,k)=>[p[0]+d[0]*k,p[1]+d[1]*k,p[2]+d[2]*k];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
function easeOutBack(x){x=clamp(x,0,1);const c1=1.70158,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2;}
function rot(v,ca,sa,ct,st){const xr=v[0]*ca-v[2]*sa,zr=v[0]*sa+v[2]*ca;return[xr,v[1]*ct-zr*st,v[1]*st+zr*ct];}
const coneR=y=>Math.max(R0,R0+KC*(y-Y0));
function onCone(xo,y,lift){const rad=coneR(y),phi=clamp(xo/rad,-1.5,1.5),sp=Math.sin(phi),cp=Math.cos(phi);return[rad*sp,rad*cp+lift,norm([sp,-KC,cp])];}

function tables(kind,petals){
  const reach=[],tone=[];
  for(let i=0;i<NTAB;i++){
    const ph=(i+0.5)/NTAB*TWO_PI;let r=1,tn=0;
    if(kind===ROSE) r=0.90+0.10*Math.cos(5*ph);
    else if(kind===DAISY||kind===SUN){const c=Math.abs(Math.cos(petals*ph/2));r=kind===DAISY?0.34+0.66*c**1.2:0.52+0.48*c**0.7;tn=0.14*(c-0.5);}
    else if(kind===SAKURA){const pa=mod(ph*5/TWO_PI,1);r=0.64+0.36*Math.max(0,Math.sin(Math.PI*pa))**0.6;const dn=Math.abs(pa-0.5);if(dn<0.07)r-=0.18*(1-dn/0.07);tn=-0.20*Math.exp(-(((pa-0.5)/0.09)**2));}
    else if(kind===LILY){r=0.28+0.72*Math.abs(Math.cos(3*ph))**1.6;tn=-0.22*Math.exp(-((Math.sin(3*ph)/0.22)**2));}
    reach.push(r);tone.push(tn);
  }
  return[reach,tone];
}
function Flower(kind,pos,axis,pal,R,seed,delay){
  this.kind=kind;this.pos=pos;this.axis=axis;this.pal=pal;this.R=R;this.seed=seed;this.delay=delay;
  [this.u,this.v]=basis(axis);
  const sp=SPEC[kind]||[0,0.5,0,0,0,null];
  [this.cr,this.base,this.slope,this.cup]=sp;this.cpal=sp[5];
  [this.reach,this.tone]=tables(kind,sp[4]);
}
const LEAF_OFFS=[[-0.7,0],[-0.3,-0.45],[-0.3,0],[-0.3,0.45],[0.1,-0.5],[0.1,0],[0.1,0.5],[0.5,0]];

function buildScene(density){
  const rnd=new Rng(21),K=clamp(density,0.6,1.6),n1=n=>Math.max(3,Math.floor(n*K));
  const pts=[];
  const P=(x,y,z,n,pal,tone=0,two=true,ov=null,zb=0)=>pts.push([x,y,z,n[0],n[1],n[2],pal,tone,two,ov,zb]);
  const wish=[];
  for(const pal of [ROSE_RED,ROSE_BLUSH,ROSE_PEACH,ROSE_LAV,ROSE_CORAL,ROSE_BLUSH,ROSE_RED,ROSE_PEACH]) wish.push([ROSE,pal,0.175]);
  wish.push([SUN,SUN_PETAL,0.21],[SUN,SUN_PETAL,0.20]);
  for(const pal of [LILY_PINK,LILY_WHITE,LILY_PINK]) wish.push([LILY,pal,0.185]);
  for(let i=0;i<5;i++) wish.push([SAKURA,SAKURA_PAL,0.135]);
  for(let i=0;i<4;i++) wish.push([DAISY,DAISY_WHITE,0.125]);
  wish.push([DAISY,ASTER,0.125]);
  for(const pal of [TULIP_RED,TULIP_PINK,TULIP_YELLOW,TULIP_PURPLE]) wish.push([TULIP,pal,0.13]);
  for(let i=0;i<3;i++) wish.push([HYDRA,BLUE,0.11]);

  const placed=[],slots=[],shi=Math.sin(86*Math.PI/180);
  const order=wish.map((_,i)=>i).sort((a,b)=>wish[b][2]-wish[a][2]);
  for(const idx of order){
    const[kind,pal,R]=wish[idx],slo=Math.sin((kind===TULIP?40:12)*Math.PI/180);
    let factor=0.82,pos=null,d=null;
    for(let at=0;at<480;at++){
      if(at&&at%80===0)factor*=0.92;
      const s=rnd.uniform(slo,shi),c=Math.sqrt(1-s*s),az=rnd.uniform(0,TWO_PI);
      d=[c*Math.cos(az),s,c*Math.sin(az)];
      pos=add(CEN,d,DOME*RADIAL[kind]*rnd.uniform(0.97,1.04));
      if(placed.every(([q,Rq])=>dist(pos,q)>=factor*(R+Rq)))break;
    }
    placed.push([pos,R]);slots.push([kind,pal,R,pos,d]);
  }
  slots.sort((a,b)=>a[4][1]-b[4][1]);
  const flowers=[];
  slots.forEach(([kind,pal,R,pos,d],rank)=>{
    const axis=norm([d[0]+rnd.uniform(-0.18,0.18),d[1]+rnd.uniform(-0.08,0.20),d[2]+rnd.uniform(-0.18,0.18)]);
    const base=add(pos,axis,-0.03);
    if(base[1]>STEM_CUT){
      const tcut=(base[1]-STEM_CUT)/(base[1]-NECK[1]),ns=n1(22);
      for(let j=0;j<ns;j++){const tt=tcut*j/(ns-1);
        P(base[0]+(NECK[0]-base[0])*tt,base[1]+(NECK[1]-base[1])*tt,base[2]+(NECK[2]-base[2])*tt,[axis[0],0,axis[2]],GREENS,-0.25);}
    }
    if(kind===HYDRA){
      for(let i=0;i<n1(70);i++){const v=norm([rnd.gauss(0,1),rnd.gauss(0,1),rnd.gauss(0,1)]),q=add(pos,v,R*rnd.uniform(0.78,1.0));
        P(q[0],q[1],q[2],v,BLUE,rnd.uniform(-0.1,0.12),false,rnd.choice('*o+*'));}
      return;
    }
    flowers.push(new Flower(kind,pos,axis,pal,R,rnd.uniform(0,6.28),0.45+rank*0.085+rnd.uniform(0,0.12)));
  });

  const leaf=(q,e,f,ln,wd,tone)=>{const n=norm(cross(e,f));
    for(const[a,b]of LEAF_OFFS)P(q[0]+e[0]*a*ln+f[0]*b*wd,q[1]+e[1]*a*ln+f[1]*b*wd,q[2]+e[2]*a*ln+f[2]*b*wd,n,EUCALYPTUS,tone-0.10+0.10*a-0.05*Math.abs(b));};
  for(let i=0;i<10;i++){
    const az=(i+rnd.uniform(0,0.8))/10*TWO_PI,c=Math.cos(az),s=Math.sin(az),d=norm([c,rnd.uniform(0.15,0.7),s]),side=[-s,0,c],base=[0.30*c,0.27,0.30*s];
    const Ls=rnd.uniform(0.42,0.58),droop=rnd.uniform(0.10,0.22);
    const sp=u=>[base[0]+d[0]*Ls*u,base[1]+d[1]*Ls*u-droop*u*u,base[2]+d[2]*Ls*u];
    const nst=n1(12);
    for(let j=0;j<nst;j++){const p=sp(j/(nst-1));P(p[0],p[1],p[2],[c,0.3,s],EUCALYPTUS,-0.2);}
    for(let k=0;k<6;k++){
      const u=0.28+0.12*k,p=sp(u),p2=sp(Math.min(1,u+0.05)),tang=norm([p2[0]-p[0],p2[1]-p[1],p2[2]-p[2]]);
      for(const sgn of[-1,1]){
        const e=norm([tang[0]+side[0]*sgn*0.9,tang[1],tang[2]+side[2]*sgn*0.9]);
        let f=norm(cross(e,[0,1,0]));if(f[0]===0&&f[1]===0&&f[2]===0)f=basis(e)[0];
        leaf(add(p,e,0.03),e,f,0.062-0.012*k/5,0.034,rnd.uniform(-0.08,0.08));
      }
    }
  }
  for(let i=0;i<8;i++){
    const a=(i+0.5)/8*TWO_PI+rnd.uniform(-0.1,0.1),c=Math.cos(a),s=Math.sin(a),base=[0.30*c,0.27,0.30*s];
    const d=norm([c,0.30+rnd.uniform(-0.1,0.15),s]),side=[-s,0,c],n=norm(cross(side,d)),Ll=rnd.uniform(0.30,0.40),W=0.075,nu=n1(24),nv=n1(9)|1;
    for(let ti=0;ti<nu;ti++){
      const t=ti/(nu-1),wid=W*Math.sin(Math.PI*t**0.85)*(1+0.10*Math.sin(26*t));
      for(let wi=0;wi<nv;wi++){
        const w=wi/(nv-1)*2-1,rib=wi===(nv>>1)?0.22:0;
        P(base[0]+d[0]*Ll*t+side[0]*wid*w+n[0]*0.03*w*w,base[1]+d[1]*Ll*t-0.16*t*t+n[1]*0.03*w*w,base[2]+d[2]*Ll*t+side[2]*wid*w+n[2]*0.03*w*w,n,GREENS,rib-0.28-0.15*Math.abs(w));
      }
    }
  }
  for(let i=0;i<7;i++){
    const az=i/7*TWO_PI+rnd.uniform(-0.3,0.3),el=rnd.uniform(48,80)*Math.PI/180;
    const d=[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)],[bu,bv]=basis(d),rEnd=rnd.uniform(0.95,1.07),nj=n1(14);
    for(let j=0;j<nj;j++){const q=add(CEN,d,0.45+(rEnd*0.78-0.45)*j/(nj-1));P(q[0],q[1],q[2],[d[0],0,d[2]],GREENS,-0.1);}
    const nb=n1(16);
    for(let j=0;j<nb;j++){const rr=rEnd*0.76+(rEnd-rEnd*0.76)*j/(nb-1);
      for(let k=0;k<3;k++){const ak=k/3*TWO_PI+j*1.7,off=0.013*(1-0.5*j/nb);
        const q=add(add(add(CEN,d,rr),bu,off*Math.cos(ak)),bv,off*Math.sin(ak));
        P(q[0],q[1],q[2],d,LAVENDER,rnd.uniform(-0.1,0.12),false,k?';':':',0.01);}}
  }
  const rings=n1(52);
  for(let i=0;i<rings;i++){
    const t=i/(rings-1),r=R0+(R1-R0)*t,cnt=Math.max(10,Math.floor(170*r*K));
    for(let j=0;j<cnt;j++){
      const ph=(j+rnd.random()*0.9)/cnt*TWO_PI,c=Math.cos(ph),s=Math.sin(ph),cuff=t>0.9;
      let rr=r*(1+0.05*(0.3+0.7*t)*Math.sin(7*ph+1.3*t));
      if(cuff)rr*=1+0.08*(t-0.9)/0.1;
      const y=Y0+(Y1-Y0)*t+0.045*(Math.abs(Math.sin(5*ph+0.3))-0.55)*t**4;
      const d=mod(ph-(0.7+2.1*t)+Math.PI,TWO_PI)-Math.PI;
      let tone=0.30+0.17*Math.cos(7*ph+1.3*t)-0.14*(1-t),pal;
      if(cuff){pal=PAPER_CREAM;tone+=0.10;}
      else if(Math.abs(d)<0.55){pal=PAPER_LAV;if(Math.abs(Math.abs(d)-0.55)<0.05)tone+=0.30;}
      else pal=PAPER_PINK;
      P(rr*c,y,rr*s,norm([c,-KC,s]),pal,tone);
    }
  }
  for(let k=0;k<7;k++){
    const t=0.14+0.11*k,r=R0+(R1-R0)*t,cnt=Math.max(5,Math.floor(r*17*K));
    for(let j=0;j<cnt;j++){
      const ph=(j+0.5*(k%2))/cnt*TWO_PI,d=mod(ph-(0.7+2.1*t)+Math.PI,TWO_PI)-Math.PI;
      if(Math.abs(d)<0.68)continue;
      const c=Math.cos(ph),s=Math.sin(ph),rr=r*(1+0.05*(0.3+0.7*t)*Math.sin(7*ph+1.3*t))*1.012;
      P(rr*c,Y0+(Y1-Y0)*t,rr*s,norm([c,-KC,s]),HEART_PRINT,0.30,false,HEART,0.03);
    }
  }
  const collar=(ya,yb,ra,rb,nrings,kc,pal,crink,rimAmp,phase)=>{
    const nr=n1(nrings),slope=(rb-ra)/(yb-ya);
    for(let i=0;i<nr;i++){
      const t=i/(nr-1),r=ra+(rb-ra)*t**0.8,cnt=Math.max(10,Math.floor(kc*r*K));
      for(let j=0;j<cnt;j++){
        const ph=(j+rnd.random())/cnt*TWO_PI,c=Math.cos(ph),s=Math.sin(ph);
        const rr=r*(1+crink*t*(Math.sin(9*ph+3*t+phase)+0.5*Math.sin(23*ph+phase)));
        const y=ya+(yb-ya)*t+rimAmp*t**3*(Math.abs(Math.sin(6.5*ph+phase))-0.5);
        const tone=0.18+0.22*Math.cos(9*ph+3*t+phase)+0.10*Math.sin(23*ph)-0.10*(1-t);
        P(rr*c,y,rr*s,norm([c,-slope*0.8,s]),pal,tone);
      }
    }
  };
  collar(0.24,0.45,0.34,0.66,18,120,TISSUE,0.07,0.07,0.4);
  collar(0.24,0.56,0.32,0.50,14,100,TISSUE_LAV,0.06,0.06,2.0);

  const br=coneR(BY)+0.012,nb=n1(110);
  for(let j=0;j<nb;j++){const ph=j/nb*TWO_PI,c=Math.cos(ph),s=Math.sin(ph);
    for(const dy of[-0.016,-0.005,0.005,0.016]){const rr=br+KC*dy;
      P(rr*c,BY+dy,rr*s,[c,-0.1,s],RIBBON,0.28+0.12*Math.sin(3*ph)+(dy===0.005?0.12:0));}}
  const k0y=BY,k0z=coneR(BY)+0.03,e1=[1,0,0],e2=norm([0,1,KC]),nB=norm([0,-KC,1]);

function rasterFlower(fl,g,t,cam,zbuf,chars,colors,viewRows,cols){

function render(scene,t,ang,cols,rows,viewRows,scale,hearts,petals,msg,hint){
  const chars=Array.from({length:rows},()=>new Array(cols).fill(' ')),colors=Array.from({length:rows},()=>new Array(cols).fill(0)),zbuf=Array.from({length:rows},()=>new Array(cols).fill(-1e9));
  const tilt=TILT+0.035*Math.sin(t*0.5),ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(tilt),st=Math.sin(tilt);
  const sxs=scale*2,cx=cols/2,cy=1+Math.max(0,(viewRows-2-1.8*scale)/2)+(TOP_Y-PIVOT_Y)*scale,cam=[ca,sa,ct,st,cx,cy,sxs,scale];
  const plot=(col,row,z,ch,color)=>{if(row>=0&&row<viewRows&&col>=0&&col<cols&&z>zbuf[row][col]){zbuf[row][col]=z;chars[row][col]=ch;colors[row][col]=color;}};
  const project=(x,y,z)=>{const xr=x*ca-z*sa,zr=x*sa+z*ca,yp=y-PIVOT_Y,yt=yp*ct-zr*st,zt=yp*st+zr*ct,f=CAM_DIST/(CAM_DIST-zt);
    return[Math.trunc(cx+xr*f*sxs),Math.trunc(cy-yt*f*scale),zt];};
  for(const[sx,sy,ph,spd]of scene.stars){const tw=Math.sin(t*spd+ph),col=Math.trunc(sx*cols),row=Math.trunc(sy*viewRows);
    if(tw>0.93)plot(col,row,-80,'+',252);else if(tw>0.5)plot(col,row,-80,'\u00b7',247);else if(tw>0)plot(col,row,-80,'\u00b7',240);}
  for(const[x,y,,ph,color]of hearts)plot(mod(Math.trunc((x+0.015*Math.sin(t*1.2+ph))*cols),cols),Math.trunc(y*viewRows),-50,HEART,color);
  for(const[x,y,,ph,color]of petals)plot(mod(Math.trunc((x+0.04*Math.sin(t*0.9+ph))*cols),cols),Math.trunc(y*viewRows),-50,PETAL_CHARS[Math.trunc(t*2.2+ph*3)%4],color);

  drawCore(cam,zbuf,chars,colors,viewRows,cols);
  for(const fl of scene.flowers){const g=INTRO?easeOutBack((t-fl.delay)/1.1):1;if(g>0.02)rasterFlower(fl,g,t,cam,zbuf,chars,colors,viewRows,cols);}
  drawPoints(scene.pts,cam,zbuf,chars,colors,viewRows,cols);
  drawPoints(dynamicPoints(t,scene.K),cam,zbuf,chars,colors,viewRows,cols);

  const show=INTRO?clamp((t-2.5)/2,0,1):1;
  if(show>0){
    scene.babies.forEach(([x,y,z,ph],i)=>{if(i/scene.babies.length>show)return;const[col,row,zt]=project(x,y,z),star=Math.sin(t*2+ph)>0.6;plot(col,row,zt+0.02,star?'*':'\u00b7',star?231:255);});
    for(const[x,y,z,ph,sp]of scene.sparkles){const[col,row,zt]=project(x,y,z),tw=Math.sin(t*sp+ph);
      if(tw>0.85)plot(col,row,zt,'*',231);else if(tw>0.4)plot(col,row,zt,'+',225);else if(tw>0)plot(col,row,zt,'\u00b7',218);}
    for(const[rad,y0,om,ph]of scene.flies)[['*',229],['+',223],['\u00b7',218],['\u00b7',175]].forEach(([c,col],k)=>{
      const a=ph+t*om-k*0.10*(om>0?1:-1),yy=y0+0.08*Math.sin(t*0.9+ph),[cc,rr,zt]=project(rad*Math.cos(a),yy,rad*Math.sin(a));plot(cc,rr,zt+0.1,c,col);});
  }
  const shift=Math.trunc(t*8);
  if(TO_NAME){const label='for '+TO_NAME,s0=Math.max(0,Math.floor((cols-label.length)/2));
    [...label].forEach((ch,i)=>{if(s0+i<cols&&ch!==' '){chars[0][s0+i]=ch;colors[0][s0+i]=MSG_COLORS[(i+shift)%MSG_COLORS.length];}});}
  if(hint>0&&cols>=70){
    const txt='space pause  \u00b7  +/- spin  \u00b7  r reverse  \u00b7  n next',limit=!TO_NAME?cols-1:Math.floor((cols-TO_NAME.length)/2)-8;
    [...txt].forEach((ch,i)=>{if(ch!==' '&&i+1<limit){chars[0][i+1]=ch;colors[0][i+1]=hint>0.5?240:238;}});
  }
  const[lines,lo,hi]=msg,nTotal=lines.reduce((a,l)=>a+l.length,0),typing=lo===0&&hi<nTotal&&Math.trunc(t*3)%2===0;
  let idx=0;
  lines.forEach((line,li)=>{
    const r=viewRows+li;if(r>=rows-1){idx+=line.length;return;}
    const start=Math.max(0,Math.floor((cols-line.length)/2));
    for(let i=0;i<line.length;i++,idx++){const c=start+i,ch=line[i];
      if(c<cols){if(idx>=lo&&idx<hi&&ch!==' '){chars[r][c]=ch;colors[r][c]=MSG_COLORS[(idx+shift)%MSG_COLORS.length];}
        else if(idx===hi&&typing){chars[r][c]='_';colors[r][c]=211;}}}
  });
  const sstart=Math.max(0,Math.floor((cols-SIGNATURE.length)/2)),pulse=238+Math.trunc(2*(0.5+0.5*Math.sin(t*1.5)));
  [...SIGNATURE].forEach((ch,i)=>{if(sstart+i<cols){chars[rows-1][sstart+i]=ch;colors[rows-1][sstart+i]=pulse;}});
  ENV=null;
  if(LETTER&&(!INTRO||t>3.5)){
    const SP=['.-----------.','|\\         /|','| \\       / |','|  \\     /  |','|   \\___/   |',"'-----------'"],W=13;
    const bob=Math.round(Math.sin(t*2)*0.6),c0=Math.max(0,Math.min(cols-W-1,Math.round(cx+0.55*sxs)));
    const r0=Math.max(2,Math.min(viewRows-SP.length-3,Math.floor(cy+0.35*scale)))+bob,hb=0.5+0.5*Math.sin(t*3);
    SP.forEach((line,i)=>{for(let j=0;j<W;j++){const r=r0+i,c=c0+j,ch=line[j];if(r<0||r>=rows-1||c>=cols)continue;
      chars[r][c]=ch;colors[r][c]=ch==='\u2665'?(hb>0.5?197:161):(ch==='\\'||ch==='/'||ch==='_')?211:217;}});
    const lab='~ open me ~',ls=c0+Math.floor((W-lab.length)/2),lr=r0+SP.length+1;
    if(lr<rows-1)[...lab].forEach((ch,i)=>{if(ls+i<cols&&ch!==' '){chars[lr][ls+i]=ch;colors[lr][ls+i]=hb>0.5?218:211;}});
    ENV={c:c0,r:r0,w:W,h:SP.length+2};
  }
  return[chars,colors];
}

function updateParticles(hearts,petals,dt){
  while(hearts.length<NUM_HEARTS)hearts.push([Math.random(),Math.random()*1.25,0.03+Math.random()*0.05,Math.random()*6.28,HEART_COLORS[Math.floor(Math.random()*6)]]);
  while(petals.length<NUM_PETALS)petals.push([Math.random(),Math.random()*1.25,0.05+Math.random()*0.06,Math.random()*6.28,PETAL_COLORS[Math.floor(Math.random()*6)]]);
  for(const grp of[hearts,petals])for(const h of grp){h[1]-=h[2]*dt;if(h[1]<0){h[0]=Math.random();h[1]=1;h[4]=(grp===hearts?HEART_COLORS:PETAL_COLORS)[Math.floor(Math.random()*6)];}}
}
function msgPhase(n,tt){
  const typeD=n/TYPE_CPS,hold=2.6+0.03*n,eraseD=0.9;
  if(tt<0)return[0,0,false];
  if(tt<typeD)return[0,Math.trunc(tt*TYPE_CPS),false];
  if(tt<typeD+hold)return[0,n,false];
  if(tt<typeD+hold+eraseD)return[Math.trunc((tt-typeD-hold)/eraseD*n),n,false];
  return[n,n,tt>typeD+hold+eraseD+0.5];
}
function wrap(text,width){
  const words=text.split(/\s+/).filter(Boolean),lines=[];let cur='';
  for(const w of words){if(!cur)cur=w;else if(cur.length+1+w.length<=width)cur+=' '+w;else{lines.push(cur);cur=w;}}
  if(cur)lines.push(cur);return lines.length?lines:[''];
}

/* xterm-256 palette */
const STD=['#000000','#800000','#008000','#808000','#000080','#800080','#008080','#c0c0c0','#808080','#ff0000','#00ff00','#ffff00','#5c5cff','#ff00ff','#00ffff','#ffffff'];
const PAL=[];for(let n=0;n<256;n++){if(n<16)PAL.push(STD[n]);else if(n<232){const m=n-16,v=[0,95,135,175,215,255];PAL.push(`rgb(${v[Math.floor(m/36)]},${v[Math.floor(m/6)%6]},${v[m%6]})`);}else{const g=8+10*(n-232);PAL.push(`rgb(${g},${g},${g})`);}}

/* main loop */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scene=null,sceneDensity=null,hearts=[],petals=[],wrapCache={},ang=0,spinMul=1,spinOn=true,msgI=0,msgT0=INTRO?0.9:0.3;
let cols=0,rows=0,cw=0,chh=0,dpr=1,fontPx=12;
function resize(){
  dpr=window.devicePixelRatio||1;const W=innerWidth,H=innerHeight;
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  cw=clamp(W/110,3.5,9);chh=cw*2;fontPx=chh*0.9;
  cols=Math.max(20,Math.floor(W/cw)-1);rows=Math.max(12,Math.floor(H/chh)-1);wrapCache={};
}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){spinOn=!spinOn;e.preventDefault();}else if(k==='+'||k==='=')spinMul=Math.min(6,spinMul*1.25);
  else if(k==='-'||k==='_')spinMul=Math.max(0.1,spinMul/1.25);else if(k==='r'||k==='R')spinMul=-spinMul;
  else if(k==='n'||k==='N')nextMsg();else if(k==='o'||k==='O')openLetter();else if(k==='Escape')closeLetter();});
const LB=document.getElementById('letter'),LT=document.getElementById('lt');let typer=null;let skip=false;const CARD=document.getElementById('card');CARD.addEventListener('pointerdown',()=>{skip=true;});
function openLetter(){if(!LETTER)return;LB.style.display='flex';LT.textContent='';requestAnimationFrame(()=>LB.classList.add('show'));
  let i=0;skip=false;clearInterval(typer);typer=setInterval(()=>{i=skip?LETTER.length:i+4;LT.textContent=LETTER.slice(0,i);if(!skip)CARD.scrollTop=CARD.scrollHeight;if(i>=LETTER.length)clearInterval(typer);},30);}
function closeLetter(){clearInterval(typer);LB.classList.remove('show');setTimeout(()=>{if(!LB.classList.contains('show'))LB.style.display='none';},360);}
document.getElementById('x').addEventListener('click',closeLetter);
LB.addEventListener('pointerdown',e=>{if(e.target===LB)closeLetter();});
let lastTap=0;
cv.addEventListener('pointerdown',e=>{
  const ox=(innerWidth-cols*cw)/2,c=(e.clientX-ox)/cw,r=e.clientY/chh;
  if(ENV&&c>=ENV.c-2&&c<=ENV.c+ENV.w+2&&r>=ENV.r-1&&r<=ENV.r+ENV.h+1){openLetter();return;}
  const n=performance.now();if(n-lastTap<350)nextMsg();else spinOn=!spinOn;lastTap=n;});
let T=0;function nextMsg(){msgI=(msgI+1)%MESSAGES.length;msgT0=T;}
let last=performance.now(),t0=last,acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const el=now-last;if(el<1000/FPS-2)return;
  const dt=Math.min(0.1,el/1000);last=now;T=(now-t0)/1000;
  if(!wrapCache[cols])wrapCache[cols]=MESSAGES.map(m=>wrap(m,Math.max(12,cols-4)));
  const wrapped=wrapCache[cols],msgRows=Math.min(3,Math.max(...wrapped.map(w=>w.length)));
  const[viewRows,scale]=layout(cols,rows,msgRows),density=Math.round(clamp(scale/24,0.6,1.6)*4)/4;
  if(!scene||density!==sceneDensity){scene=buildScene(density);sceneDensity=density;}
  if(spinOn)ang+=SPIN_SPEED*spinMul*dt;
  updateParticles(hearts,petals,dt);
  const lines=wrapped[msgI].slice(0,3),nTotal=lines.reduce((a,l)=>a+l.length,0),[lo,hi,done]=msgPhase(nTotal,T-msgT0);
  if(done)nextMsg();
  const hint=clamp((11-T)/2,0,1),[chars,colors]=render(scene,T,ang,cols,rows,viewRows,scale,hearts,petals,[lines,lo,hi],hint);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0b0710';ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.font=`${fontPx}px ui-monospace,Menlo,Consolas,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  const ox=(innerWidth-cols*cw)/2;
  for(let r=0;r<rows;r++){let lc=-1;const rc=chars[r],rcol=colors[r],y=(r+0.5)*chh;
    for(let c=0;c<cols;c++){const ch=rc[c];if(ch===' ')continue;if(rcol[c]!==lc){lc=rcol[c];ctx.fillStyle=PAL[lc];}ctx.fillText(ch,ox+(c+0.5)*cw,y);}}
}
requestAnimationFrame(frame);
</script>
